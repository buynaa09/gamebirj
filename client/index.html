    <script>
      // Default to dark mode. Restore the saved theme before first paint
      // to avoid a flash. Key must match ThemeProvider ('ascend-theme').
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('ascend-theme');
        } catch (e) { /* ignore */ }
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
