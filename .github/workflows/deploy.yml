name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Захиалсан папка руугаа шилжих
            cd projects/soliltsoo/backend

            # 2. Шинэ кодоо зангидах
            git pull origin main

            # 3. Шинэ образ бүтээж, ар талд (detached) асаах
            docker compose -f docker-compose.production.yml up -d --build

            # 4. Дөгөгдлийн санг шинэчлэх (Migration)
            docker compose -f docker-compose.production.yml exec -T django python manage.py migrate --no-input

            # 5. Хэрэггүй болсон хуучин Docker image-үүдийг цэвэрлэж серверийн зайн хэмнэлт хийх
            docker image prune -f
